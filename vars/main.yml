---

# vars file for RHEL9-CIS

# Set default value for reboot value
change_requires_reboot: false

min_ansible_version: 2.16.1
rhel9cis_allowed_crypto_policies:
  - 'DEFAULT'
  - 'FUTURE'
  - 'FIPS'

# Following is left blank for ability to build string
rhel9cis_crypto_policy_module: ''

# Do not adjust these are recognized as part of the CIS benchmark and used during testing
rhel9cis_allowed_crypto_policies_modules:
  # Recognized by CIS as possible extra options
  - 'OSPP'
  - 'AD-SUPPORT'
  - 'AD-SUPPORT-LEGACY'
  # The following are already included in 1.6.x controls
  - 'NO-SHA1'
  - 'NO-SSHCBC'
  - 'NO-SSHETM'
  - 'NO-SSHWEAKCIPHER'
  - 'NO-SSHWEAKMAC'
  - 'NO-WEAKMAC'

# Ability to change the default shell
# Note this can change how some of the ansible.builtin.shell tasks work and may require adjustments to args.executable for those tasks
# Used mainly for overriding to use a more POSIX compliant shell such as dash or ash when running in a container environment
rhel9cis_shell_executable: /bin/bash

# Used to control warning summary
warn_control_list: ""
warn_count: 0

# list of dicts of interactive users, filled in during prelim.yml
prelim_interactive_users: []

# Default empty values for 1.4.2
efi_mount_opts_addition: ''

gpg_key_package: "{{ ansible_facts['distribution'] | lower }}-gpg-keys"

## Controls 6.3.3.x - Audit template
# This variable is set to true by tasks 6.3.3.1 to 6.3.3.20. As a result, the
# audit settings are overwritten with the role's template. In order to exclude
# specific rules, you must set the variable of form `rhel9cis_rule_6_3_3_x` above
# to `false`.
update_audit_template: false

# Defaults
## Usage on containerized images
# The role discovers dynamically (in tasks/main.yml) whether it
# is executed on a container image and sets the variable
# system_is_container the true. Otherwise, the default value
# 'false' is left unchanged.
system_is_container: false

# rhel9cis is left off the front of this var for consistency in testing pipeline
# system_is_ec2 toggle will disable tasks that fail on Amazon EC2 instances. Set true to skip and false to run tasks
system_is_ec2: false

# Aide Packages

aide_packages:
  - aide
# Aide initiate command for new DB creation
aide_initiate_command: /usr/sbin/aide --init

# Audit vars
audit_bins:
  - /sbin/auditctl
  - /sbin/aureport
  - /sbin/ausearch
  - /sbin/autrace
  - /sbin/auditd
  - /sbin/augenrules

company_title: 'MindPoint Group - A Tyto Athene Company'

file_managed_by_ansible: |-
  # File managed by ansible as part of {{ benchmark }} benchmark
  # As part of Ansible-lockdown
  # Provided by {{ company_title }}

# Packages and service 2.1.x
#
avahi_pkgs:
  - avahi-autoipd
  - avahi

avahi_services:
  - avahi-daemon.socket
  - avahi-daemon.service

dhcp_pkgs:
  - dhcp-server
dhcp_services:
  - dhcpd.service
  - dhcpd6.service

dns_pkgs:
  - bind
dns_services:
  - named.service

dnsmasq_pkgs:
  - dnsmasq
dnsmasq_services:
  - dnsmasq.service

samba_pkgs:
  - samba
samba_services:
  - smb.service

vsftpd_pkgs:
  - vsftpd
vsftpd_services:
  - vsftpd.service

message_pkgs:
  - dovecot
  - cyrus-imapd
message_services:
  - dovecot.socket
  - dovecot.service
  - cyrus-imapd.service

nfs_pkgs:
  - nfs-utils
nfs_services:
  - nfs-server.service

nis_pkgs:
  - ypserv
nis_services:
  - ypserv.service

print_pkgs:
  - cups
print_services:
  - cups.service
  - cups.socket

rpcbind_pkgs:
  - rpcbind
rpcbind_services:
  - rpcbind.service
  - rpcbind.socket

rsync_pkgs:
  - rsync-daemon
rsync_services:
  - rsyncd.service
  - rsyncd.socket

snmp_pkgs:
  - net-snmp
snmp_services:
  - net-snmp.service

telnet_pkgs:
  - telnet-server
telnet_services:
  - telnet.socket

tftp_pkgs:
  - tftp-server
tftp_services:
  - tftp.service
  - tftp.socket

proxy_pkgs:
  - squid
proxy_services:
  - squid.service

xinetd_pkgs:
  - xinetd
xinetd_services:
  - xinetd.service
