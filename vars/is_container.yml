---

# File to skip controls if container
# Based on standard image with no changes.
# It is expected all pkgs required for the container are already installed.

## controls

# Firewall -- no firewall stack in minimal containers
rhel9cis_firewall: ~  # null -- firewall package/service tasks are skipped

# SElinux -- containers share host kernel; SELinux policy not writable
rhel9cis_selinux_disable: true

## Related individual rules

# AIDE -- filesystem integrity daemon not appropriate for containers
rhel9cis_rule_1_4_1: false
rhel9cis_rule_1_4_2: false

# Kernel module -- usb-storage (container shares host kernel)
rhel9cis_rule_1_1_1_8: false

# Mounts -- containers share host mounts; separate partitions not applicable
# /tmp
rhel9cis_rule_1_1_2_1_1: false
rhel9cis_rule_1_1_2_1_2: false
rhel9cis_rule_1_1_2_1_3: false
rhel9cis_rule_1_1_2_1_4: false
# /var
rhel9cis_rule_1_1_2_2_1: false
# /home
rhel9cis_rule_1_1_2_3_1: false
rhel9cis_rule_1_1_2_3_2: false
rhel9cis_rule_1_1_2_3_3: false
# /dev/shm
rhel9cis_rule_1_1_2_4_1: false
rhel9cis_rule_1_1_2_4_2: false
rhel9cis_rule_1_1_2_4_3: false
# /var/tmp
rhel9cis_rule_1_1_2_5_1: false
rhel9cis_rule_1_1_2_5_2: false
rhel9cis_rule_1_1_2_5_3: false
rhel9cis_rule_1_1_2_5_4: false
# /var/log
rhel9cis_rule_1_1_2_6_1: false
rhel9cis_rule_1_1_2_6_2: false
rhel9cis_rule_1_1_2_6_3: false
# /var/log/audit
rhel9cis_rule_1_1_2_7_1: false
rhel9cis_rule_1_1_2_7_2: false
rhel9cis_rule_1_1_2_7_3: false
rhel9cis_rule_1_1_2_7_4: false

# Bootloader / kernel args -- grubby fails in containers (no /boot, kernel args set on host)
rhel9cis_rule_6_3_1_2: false  # audit=1 kernel arg via grubby
rhel9cis_rule_6_3_1_3: false  # audit_backlog_limit via grubby

# Crypto policy -- update-crypto-policies may not work in minimal containers
rhel9cis_rule_1_6_1: false
rhel9cis_rule_1_6_2: false
rhel9cis_rule_1_6_3: false
rhel9cis_rule_1_6_4: false
rhel9cis_rule_1_6_5: false
rhel9cis_rule_1_6_6: false
rhel9cis_rule_1_6_7: false

# Time synchronization -- no chrony daemon in containers
rhel9cis_rule_2_3_1: false
rhel9cis_rule_2_3_2: false
rhel9cis_rule_2_3_3: false

# Wireless -- no wireless adapters in containers
rhel9cis_rule_3_1_2: false

