---

- name: "6.3.4.1 | PATCH | Ensure the audit log file directory mode is configured"
  when: rhel9cis_rule_6_3_4_1
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.1
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ prelim_auditd_logfile.stdout | dirname }}"
    state: directory
    mode: 'g-w,o-rwx'

- name: "6.3.4.2 | PATCH | Ensure audit log files mode is configured"
  when: rhel9cis_rule_6_3_4_2
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.2
    - NIST800-53R5_AU-3
  block:
    - name: "6.3.4.2 | AUDIT | Ensure audit log files mode is configured | Find audit log files"
      ansible.builtin.find:
        paths: "{{ prelim_auditd_logfile.stdout | dirname }}"
        file_type: file
      register: discovered_auditd_logfiles_mode

    - name: "6.3.4.2 | PATCH | Ensure audit log files mode is configured | Set mode"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: 'u-x,g-wx,o-rwx'
      loop: "{{ discovered_auditd_logfiles_mode.files }}"

- name: "6.3.4.3 | PATCH | Ensure audit log files owner is configured"
  when: rhel9cis_rule_6_3_4_3
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.3
    - NIST800-53R5_AU-3
  block:
    - name: "6.3.4.3 | AUDIT | Ensure audit log files owner is configured | Find audit log files"
      ansible.builtin.find:
        paths: "{{ prelim_auditd_logfile.stdout | dirname }}"
        file_type: file
      register: discovered_auditd_logfiles_owner

    - name: "6.3.4.3 | PATCH | Ensure audit log files owner is configured | Set owner"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
      loop: "{{ discovered_auditd_logfiles_owner.files }}"

- name: "6.3.4.4 | PATCH | Ensure audit log files group owner is configured"
  when: rhel9cis_rule_6_3_4_4
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.4
    - NIST800-53R5_AU-3
  block:
    - name: "6.3.4.4 | AUDIT | Ensure audit log files group owner is configured | Get log_group"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Po '^\s*log_group\s*=\s*\K\S+' /etc/audit/auditd.conf | tail -n 1
      args:
        executable: "{{ rhel9cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_auditd_log_group

    - name: "6.3.4.4 | PATCH | Ensure audit log files group owner is configured | Set log_group"
      when: discovered_auditd_log_group.stdout not in ['root', 'adm']
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^\s*#?\s*log_group\s*='
        line: 'log_group = root'
      notify: Restart auditd

    - name: "6.3.4.4 | AUDIT | Ensure audit log files group owner is configured | Find audit log files"
      ansible.builtin.find:
        paths: "{{ prelim_auditd_logfile.stdout | dirname }}"
        file_type: file
      register: discovered_auditd_logfiles_group

    - name: "6.3.4.4 | PATCH | Ensure audit log files group owner is configured | Set group"
      when: item.gr_name not in ['root', 'adm']
      ansible.builtin.file:
        path: "{{ item.path }}"
        group: root
      loop: "{{ discovered_auditd_logfiles_group.files }}"

- name: "6.3.4.5 | PATCH | Ensure audit configuration files mode is configured"
  when: rhel9cis_rule_6_3_4_5
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.5
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: 'u-x,g-wx,o-rwx'
  loop: "{{ prelim_auditd_conf_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.3.4.6 | PATCH | Ensure audit configuration files owner is configured"
  when: rhel9cis_rule_6_3_4_6
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.6
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
  loop: "{{ prelim_auditd_conf_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.3.4.7 | PATCH | Ensure audit configuration files group owner is configured"
  when: rhel9cis_rule_6_3_4_7
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.7
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: root
  loop: "{{ prelim_auditd_conf_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.3.4.8 | PATCH | Ensure audit tools mode is configured"
  when: rhel9cis_rule_6_3_4_8
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.8
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ item }}"
    mode: 'go-w'
  loop: "{{ audit_bins }}"

- name: "6.3.4.9 | PATCH | Ensure audit tools owner is configured"
  when: rhel9cis_rule_6_3_4_9
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.9
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
  loop: "{{ audit_bins }}"

- name: "6.3.4.10 | PATCH | Ensure audit tools group owner is configured"
  when: rhel9cis_rule_6_3_4_10
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.4.10
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ item }}"
    group: root
  loop: "{{ audit_bins }}"
