---

- name: "6.2.1.1 | PATCH | Ensure journald service is enabled and active"
  when: rhel9cis_rule_6_2_1_1
  tags:
    - level1-server
    - level1-workstation
    - audit
    - patch
    - journald
    - rule_6.2.1.1
  ansible.builtin.systemd:
    name: systemd-journald.service
    masked: false
    state: started

- name: "6.2.1.2 | PATCH | Ensure journald log file access is configured"
  when: rhel9cis_rule_6_2_1_2
  tags:
    - level1-server
    - level1-workstation
    - audit
    - patch
    - journald
    - rule_6.2.1.2
  block:
    - name: "6.2.1.2 | AUDIT | Ensure journald log file access is configured | Get journal file tmpfiles directives"
      ansible.builtin.shell: |
        set -o pipefail
        systemd-tmpfiles --cat-config | grep -P -- '^\s*[^#\s]+\s+/var/log/journal/\S*\.journal\S*\s+'
      args:
        executable: "{{ rhel9cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_journald_tmpfiles_modes.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_journald_tmpfiles_modes

    - name: "6.2.1.2 | PATCH | Ensure journald log file access is configured | Set tmpfiles directive mode"
      when: discovered_journald_tmpfiles_modes.stdout_lines | select('search', '\.journal\S*\s+0?([1357][0-7]{2}|[0-7][1235-7][0-7]|[0-7]{2}[1-7])\s') | list | length > 0
      block:
        - name: "6.2.1.2 | PATCH | Ensure journald log file access is configured | Create local tmpfiles override"
          ansible.builtin.copy:
            src: /usr/lib/tmpfiles.d/systemd.conf
            dest: /etc/tmpfiles.d/systemd.conf
            remote_src: true
            force: false
            owner: root
            group: root
            mode: 'u-x,go-wx'

        - name: "6.2.1.2 | PATCH | Ensure journald log file access is configured | Restrict journal file mode in override"
          ansible.builtin.replace:
            path: /etc/tmpfiles.d/systemd.conf
            regexp: '^(\s*[^#\s]+\s+/var/log/journal/\S*\.journal\S*\s+)0?([1357][0-7]{2}|[0-7][1235-7][0-7]|[0-7]{2}[1-7])(\s.*)$'
            replace: '\g<1>0640\g<3>'

    - name: "6.2.1.2 | PATCH | Ensure journald log file access is configured | Restrict existing journal files"
      ansible.builtin.shell: |
        set -o pipefail
        find /var/log/journal /run/log/journal -type f -name '*.journal*' -perm /0137 -exec chmod u-x,g-wx,o-rwx {} + -print 2>/dev/null || true
      args:
        executable: "{{ rhel9cis_shell_executable }}"
      changed_when: discovered_journald_file_mode_fix.stdout | length > 0
      register: discovered_journald_file_mode_fix

- name: "6.2.1.3 | PATCH | Ensure journald log file rotation is configured"
  when: rhel9cis_rule_6_2_1_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.2.1.3
  notify: Restart journald
  block:
    - name: "6.2.1.3 | PATCH | Ensure journald log file rotation is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/rotation.conf.j2
        dest: /etc/systemd/journald.conf.d/rotation.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'

    - name: "6.2.1.3 | PATCH | Ensure journald log file rotation is configured | comment out current entries"
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: "{{ item }}"
        replace: '#\1'
      loop:
        - '^(\s*SystemMaxUse\s*=.*)'
        - '^(\s*SystemKeepFree\s*=.*)'
        - '^(\s*RuntimeMaxUse\s*=)'
        - '^(\s*RuntimeKeepFree\s*=.*)'
        - '^(\s*MaxFileSec\s*=.*)'

- name: "6.2.1.4 | PATCH | Ensure only one logging system is in use"
  when: rhel9cis_rule_6_2_1_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - syslog
    - rule_6.2.1.4
  block:
    - name: "6.2.1.4 | PATCH | Ensure only one logging system is in use | when rsyslog"
      when:
        - rhel9cis_syslog == "rsyslog"
        - "'rsyslog' in ansible_facts['packages']"
      ansible.builtin.systemd:
        name: rsyslog
        state: started
        enabled: true

    - name: "6.2.1.4 | PATCH | Ensure only one logging system is in use | when journald"
      when:
        - rhel9cis_syslog == "journald"
        - "'rsyslog' in ansible_facts['packages']"
      ansible.builtin.systemd:
        name: rsyslog
        state: stopped
        enabled: false
