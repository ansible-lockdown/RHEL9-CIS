---

# The CIS Control wants IPv6 disabled if not in use.
# We are using the rhel9cis_ipv6_required to specify if you have IPv6 in use
- name: "3.1.1 | PATCH | Ensure IPv6 status is identified"
  when:
    - not rhel9cis_ipv6_required
    - rhel9cis_rule_3_1_1
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - ipv6
    - networking
    - rule_3.1.1
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Set vars for sysctl template"
      when: "'sysctl' in rhel9cis_ipv6_disable_method"
      ansible.builtin.set_fact:
        rhel9cis_sysctl_update: true
        rhel9cis_flush_ipv6_route: true

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Message out implementation info"
      when: "'sysctl' in rhel9cis_ipv6_disable_method"
      ansible.builtin.debug:
        msg: "Control being set via Handler 'update sysctl' which writes to /etc/sysctl.d/60-disable_ipv6.conf"

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Find IPv6 status"
      when: "'kernel' in rhel9cis_ipv6_disable_method"
      ansible.builtin.command: grubby --info=ALL
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_rhel9cis_3_1_1_ipv6_status

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Disable IPV6 via Kernel"
      when:
        - "'kernel' in rhel9cis_ipv6_disable_method"
        - discovered_rhel9cis_3_1_1_ipv6_status.stdout_lines | select('match', '^args=') | reject('search', '\\bipv6\\.disable=1\\b') | list | length > 0
      ansible.builtin.command: grubby --update-kernel=ALL --args="ipv6.disable=1"
      changed_when: true

- name: "3.1.2 | PATCH | Ensure wireless interfaces are disabled"
  when:
    - rhel9cis_rule_3_1_2
    - not system_is_container
    - prelim_wireless_adapters.stdout | length > 0
  tags:
    - level1-server
    - patch
    - rule_3.1.2
    - wireless
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.2 | AUDIT | Ensure wireless interfaces are disabled | Discover wireless driver modules"
      ansible.builtin.shell: |
        set -o pipefail
        for l_dir in $(find /sys/class/net/*/ -type d -name wireless); do
          l_mod="$(readlink -e "$(dirname "$l_dir")"/device/driver/module)" && basename "$l_mod"
        done | sort -u
      args:
        executable: "{{ rhel9cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_wireless_modules

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are disabled | Set modules un-loadable"
      ansible.builtin.lineinfile:
        path: "/etc/modprobe.d/{{ item }}.conf"
        regexp: '^\s*#?\s*install\s+{{ item }}(\s|$)'
        line: "install {{ item }} /bin/false"
        create: true
        mode: 'u-x,go-rwx'
      loop: "{{ discovered_wireless_modules.stdout_lines }}"

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are disabled | Deny list modules"
      ansible.builtin.lineinfile:
        path: "/etc/modprobe.d/{{ item }}.conf"
        regexp: '^\s*#?\s*blacklist\s+{{ item }}(\s|$)'
        line: "blacklist {{ item }}"
        create: true
        mode: 'u-x,go-rwx'
      loop: "{{ discovered_wireless_modules.stdout_lines }}"

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are disabled | Unload modules"
      community.general.modprobe:
        name: "{{ item }}"
        state: absent
      loop: "{{ discovered_wireless_modules.stdout_lines }}"

- name: "3.1.3 | PATCH | Ensure bluetooth services are not in use"
  when: rhel9cis_rule_3_1_3
  tags:
    - level1-server
    - level2-workstation
    - patch
    - bluetooth
    - rule_3.1.3
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.3 | PATCH | Ensure bluetooth services are not in use | pkg"
      when:
        - not rhel9cis_bluetooth_service
        - not rhel9cis_bluetooth_mask
      ansible.builtin.package:
        name: bluez
        state: absent

    - name: "3.1.3 | PATCH | Ensure bluetooth services are not in use | mask"
      when:
        - not rhel9cis_bluetooth_service
        - rhel9cis_bluetooth_mask
      notify: Systemd daemon reload
      ansible.builtin.systemd:
        name: bluetooth.service
        enabled: "{{ ('bluez' in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ ('bluez' in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true
