---

- name: POST | Gather the package facts after remediation
  tags: always
  ansible.builtin.package_facts:
    manager: auto

- name: POST | Update sysctl
  when:
    - rhel9cis_sysctl_update
    - not system_is_container
    - "'procps-ng' in ansible_facts['packages']"
  tags:
    - patch
    - sysctl
  ansible.builtin.template:
    src: "etc/sysctl.d/{{ item }}.j2"
    dest: "/etc/sysctl.d/{{ item }}"
    owner: root
    group: root
    mode: 'go-rwx'
  notify:
    - Reload sysctl
    - Sysctl flush ipv4 route table
    - Sysctl flush ipv6 route table
  loop:
    - 60-kernel_sysctl.conf
    - 60-disable_ipv6.conf
    - 60-netipv4_sysctl.conf
    - 60-netipv6_sysctl.conf

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: POST | Rebuild initrd when its sysctl settings differ from the system
  when:
    - rhel9cis_disruption_high
    - not system_is_container
  tags:
    - patch
    - sysctl
  block:
    - name: POST | Rebuild initrd when its sysctl settings differ from the system | Compare sysctl files
      ansible.builtin.shell: |
        set -o pipefail
        img="/boot/initramfs-$(uname -r).img"
        [ -f "$img" ] || exit 0
        listing="$(lsinitrd "$img" 2>/dev/null)"
        grep -qE ' etc/sysctl(\.conf|\.d/)' <<< "$listing" || exit 0
        for f in /etc/sysctl.conf /etc/sysctl.d/*.conf; do
          [ -f "$f" ] && [ ! -L "$f" ] || continue
          lsinitrd -f "${f#/}" "$img" 2>/dev/null | cmp -s - "$f" || echo "$f"
        done
      args:
        executable: "{{ rhel9cis_shell_executable }}"
      changed_when: false
      check_mode: false
      register: discovered_initrd_sysctl_drift

    - name: POST | Rebuild initrd when its sysctl settings differ from the system | Rebuild
      when: discovered_initrd_sysctl_drift.stdout | length > 0
      ansible.builtin.command: dracut --force --regenerate-all
      changed_when: true

- name: POST | reboot system if changes require it and not skipped
  when: change_requires_reboot
  tags: always
  block:
    - name: POST | Reboot system if changes require it and not skipped
      when: not skip_reboot
      ansible.builtin.reboot:

    - name: POST | Warning a reboot required but skip option set
      when: skip_reboot
      ansible.builtin.debug:
        msg: "Warning!! changes have been made that require a reboot to be implemented but skip reboot was set - Can affect compliance check results"
      changed_when: true

    - name: "POST | Warning a reboot required but skip option set | warning count"
      when: skip_reboot
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: Reboot_required
